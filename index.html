<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp link em Dev múp rụp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hiệu ứng mượt mà cho viền neon */
        .neon-hover:hover {
            box-shadow: 0 0 20px 2px rgba(99, 102, 241, 0.6);
            border-color: rgba(129, 140, 248, 1);
        }

        /* 1. LAYER ẢNH NỀN LÀM MỜ */
        .bg-image-layer {
            position: fixed;
            /* Cố tình kéo giãn ảnh ra 110% để viền blur không bị hở màu trắng */
            top: -5%; left: -5%; width: 110%; height: 110%;
            
            /* THAY TÊN FILE ẢNH NỀN CỦA ÔNG VÀO CHỖ background.jpg NÀY 👇 */
            background-image: url('background.jpg'); 
            
            background-size: cover;
            background-position: center;
            /* Chỉnh độ mờ (blur) và làm tối (brightness) để nổi chữ */
            filter: blur(12px) brightness(0.35); 
            z-index: -2;
        }

        /* 2. LAYER TEXTURE XƯỚC/NHIỄU KÍNH (Không cần up thêm ảnh) */
        .glass-texture-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Code tạo hạt nhiễu tự động */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="text-white font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white pb-20 relative bg-transparent">
    
    <!-- Gắn background phía sau cùng -->
    <div class="bg-image-layer"></div>
    <div class="glass-texture-layer"></div>
    
    <div class="max-w-2xl mx-auto px-4 py-16 relative z-10">
        
        <!-- Phần Avatar -->
        <div class="text-center mb-12">
            <img src="thumbava.JPG" alt="Avatar" class="w-28 h-28 rounded-full mx-auto border-4 border-gray-700/60 shadow-[0_0_20px_rgba(0,0,0,0.8)] object-cover hover:scale-105 transition-transform duration-300">
            <h1 class="text-3xl font-bold mt-5 text-gray-100 tracking-wide drop-shadow-md">Lộ Link Dev Nguyễn</h1>
            <p class="text-gray-300 mt-2 text-lg drop-shadow">Tổng hợp by Entidi</p>
        </div>

        <div class="space-y-6">

            <!-- LINK 1 -->
            <!-- Các khối link đã được chuyển thành kính mờ trong suốt (bg-gray-900/50 backdrop-blur-md) -->
            <a href="https://tiermaker.com/create/ca-s-vit-nam-mi-la-tui-19815966" target="_blank" class="neon-hover group block bg-gray-900/50 backdrop-blur-md border border-gray-600/50 transition-all duration-300 rounded-2xl overflow-hidden p-3 shadow-lg">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4">
                    <div class="w-full sm:w-48 flex-shrink-0 aspect-video rounded-xl overflow-hidden bg-black relative">
                        <img src="thumb1.jpg" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-110 group-hover:opacity-80 transition-all duration-500">
                    </div>
                    <div class="flex-grow pt-2 sm:pt-0 w-full">
                        <h2 class="text-xl font-bold text-gray-100 group-hover:text-indigo-300 transition-colors drop-shadow-md">Xếp hạng ca sĩ Việt Nam Part 1</h2>
                        <p class="text-sm text-gray-300 mt-2 line-clamp-2">Giữ Ctrl lăn chuột để zoom to ảnh nếu bạn bị mù.</p>
                    </div>
                </div>
            </a>
            
            <!-- LINK 2 -->
            <a href="https://tiermaker.com/create/din-vin-ngh-s-hi-vit-nam-19815966" target="_blank" class="neon-hover group block bg-gray-900/50 backdrop-blur-md border border-gray-600/50 transition-all duration-300 rounded-2xl overflow-hidden p-3 shadow-lg">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4">
                    <div class="w-full sm:w-48 flex-shrink-0 aspect-video rounded-xl overflow-hidden bg-black relative">
                        <img src="thumb2.jpg" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-110 group-hover:opacity-80 transition-all duration-500">
                    </div>
                    <div class="flex-grow pt-2 sm:pt-0 w-full">
                        <h2 class="text-xl font-bold text-gray-100 group-hover:text-indigo-300 transition-colors drop-shadow-md">Xếp hạng nghệ sĩ diễn viên hài Việt Nam</h2>
                        <p class="text-sm text-gray-300 mt-2 line-clamp-2">Giữ Ctrl lăn chuột để zoom to ảnh nếu bạn bị mù.</p>
                    </div>
                </div>
            </a>

            <!-- LINK 3 -->
            <a href="https://bit.ly/4zThfbC" target="_blank" class="neon-hover group block bg-gray-900/50 backdrop-blur-md border border-gray-600/50 transition-all duration-300 rounded-2xl overflow-hidden p-3 shadow-lg">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4">
                    <div class="w-full sm:w-48 flex-shrink-0 aspect-video rounded-xl overflow-hidden bg-black relative">
                        <img src="thumb3.jpg" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-110 group-hover:opacity-80 transition-all duration-500">
                    </div>
                    <div class="flex-grow pt-2 sm:pt-0 w-full">
                        <h2 class="text-xl font-bold text-gray-100 group-hover:text-indigo-300 transition-colors drop-shadow-md">Bộ câu hỏi bí mật cực khó</h2>
                        <p class="text-sm text-gray-300 mt-2 line-clamp-2">Đừng bấm vào nếu bạn bị ngu.</p>
                    </div>
                </div>
            </a>

        </div>
        
        <div class="text-center mt-16 text-gray-400 text-sm font-medium drop-shadow-md">
            <p>© 2026 Entidi.</p>
        </div>
        
    </div>
</body>
</html>
